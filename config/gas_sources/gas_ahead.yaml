# Gas sources for worlds/gas_ahead.wbt (generated by tools/build_worlds.py).
# ppm at the rover = peak(t) * exp(-d^2 / (2 sigma^2)); peak(t) ramps 0 -> peak_ppm over
# ramp_up_s once the rover first comes within trigger_distance_m.
sources:
- name: gas1
  position:
  - 5.0
  - 0.0
  - 0.1
  peak_ppm: 2500
  sigma_m: 1.0
  ramp_up_s: 5.0
  trigger_distance_m: 3.5
