# Mine rover tuning. Every threshold and speed the autonomy uses lives here.
# Units: metres, seconds, degrees, ppm. Motor commands are fractions of top speed (-1..1).
# Items marked (addition) are not in the original proposal table.

loop_hz: 20                  # autonomy loop rate
lamp_default_on: true        # headlamp state at start (L toggles; sweeps always switch it on)

drive:
  dead_zone: 0.35            # |command| below this produces no wheel motion (motor model)
  min_cmd: 0.42              # smallest non-zero command the navigator will issue
  cruise: 0.70               # 0.28 m/s
  slow: 0.50                 # 0.20 m/s, used below navigator.slow_dist_m
  spin: 0.55                 # in-place turn, wheels opposed
  reverse: 0.50
  ramp_per_s: 4.0            # command slew when speeding up; slowing/stopping is instant
  deadman_s: 0.4             # motors stop if no fresh command for this long
  steer_gain: 0.45           # cruise steering authority
  heading_hold_gain: 0.02    # per degree of gyro-yaw error while cruising straight
  centre_gain: 0.3           # per metre of left/right difference (capped at 0.12)
  motor_mismatch: 0.03       # simulated left/right motor gain mismatch (+-3 %, seeded)

ultrasonic:
  max_range_m: 4.0
  no_echo_margin_m: 0.10     # readings within this of max range count as "no echo"
  sample_ms: 60

ir:
  front_trigger_m: 0.12      # forward IR reports "obstacle" below this
  floor_lost_m: 0.04         # downward IR reports "no floor" above this
  debounce: 3                # consecutive samples needed to change state

imu:
  alpha: 0.98                # complementary filter weight on the gyro
  gyro_bias_time_s: 2.0      # rover must sit still this long at power-up
  impact_g: 0.9              # | |a| - 1 g | above this = impact
  impact_refractory_s: 0.5
  accel_trust_g: 0.15        # accel only corrects tilt when | |a| - 1 g | is below this
  # simulated MPU6050 imperfections (added in the controller, see README "real vs faked")
  accel_noise_mps2: 0.05
  gyro_noise_rps: 0.003
  gyro_bias_rps: 0.01

gas:
  noise_ppm: 6.0             # rover-side sensor model
  lag_s: 1.0
  warmup_s: 2.0

fusion:
  gas_danger_ppm: 800        # with rising slope -> DANGER gas build-up
  gas_slope_ppm_s: 15
  gas_slope_window_s: 4.0    # least-squares window
  gas_extreme_ppm: 3000      # (addition) DANGER even if steady
  gas_caution_ppm: 300       # (addition) steady elevated gas -> CAUTION
  gas_caution_off_ratio: 0.8 # (addition) hysteresis: CAUTION clears below 80 % of the threshold
  tilt_deg: 20
  obstacle_m: 0.35
  roof_window_s: 3.0         # obstacle must appear within this long after the impact
  roof_obstacle_m: 0.60
  roof_delta_m: 0.30         # ... and be at least this much closer than before the impact
  roof_pre_window_s: 0.4     # "before the impact" look-back
  roof_latch_s: 15.0
  roof_approach_mps: 0.4     # (addition) own forward motion allowed for when judging "new"
  roof_max_turn_deg: 15      # (addition) if the rover turns more than this after the impact, drop it
  roof_ir_window_s: 1.5      # (addition) a forward IR newly tripped this soon after the impact also counts
  stale_s: 0.5               # (addition) data older than this -> CAUTION + stop
  startup_grace_s: 1.0       # staleness is not judged this early after power-up
  hold_s: 2.0                # findings persist this long after their cause clears
  sweep_cooldown_s: 20.0     # per hazard type

navigator:
  start_mode: AUTO           # STOP | MANUAL | AUTO
  slow_dist_m: 0.80
  avoid_dist_m: 0.30
  clear_dist_m: 0.50
  clear_time_s: 0.25
  open_dist_m: 1.00          # at least one sonar must see this much room before leaving AVOID
  avoid_max_dev_deg: 100     # (addition) AVOID only ends within this of the route heading; it
                             #   sweeps back and forth between the two limits
  confirm_settle_s: 0.20     # (addition) AVOID stops on a clear reading, waits this long for the
                             #   sonar median to refresh, then needs clear_time_s of clear readings
  confirm_skip_deg: 10       # (addition) after a failed check, turn on this far before checking again
  route_settle_s: 3.0        # (addition) route heading re-bases only after this long of uninterrupted CRUISE
  route_tau_s: 2.0           # (addition) ... and then follows the heading with this time constant
  avoid_timeout_s: 8.0
  backoff_reverse_s: 0.7
  backoff_turn_deg: 60
  backoff_turn_timeout_s: 5.0
  tilt_clear_deg: 10         # tilt back-off keeps reversing until tilt is below this
  tilt_reverse_max_s: 3.0
  bias_s: 8.0                # keep away from the edge that was found for this long
  bias_dist_m: 0.60          # virtual obstacle distance on the biased side
  sidestep_s: 1.3            # after the 60 deg turn: move over this long, then face forward again
  sidestep_stop_m: 0.33      # ... or until something is this close
  sidestep_align_deg: 8
  centre_max_m: 1.6          # both sonars under this -> drift gently to the more open side
  centre_deadband_m: 0.10
  pit_count: 3               # this many pits ...
  pit_window_s: 120.0        # ... within this long -> RETURN (counted per leg: in / return)
  manual_block_m: 0.15       # manual forward refused when something is this close
  # RETURN mode (no operator underground): blocked ahead, battery reserve, mission timer or a
  # finished Danger hold turn the rover round; it steers on route heading + 180 deg.
  danger_hold_s: 30          # on DANGER: stop, finish the sweep, log, hold this long, then RETURN
  danger_rearm_ratio: 0.8    # gas the rover has held for can stop it again only after the reading
                             #   has fallen below this x the Danger threshold (640 / 2400 ppm) and risen again
  mission_time_s: 900        # 15 min after the trip starts -> RETURN (backstop)
  return_time_factor: 1.2    # HOME when return driving time reaches this x outward driving time
                             #   (or as soon as the link is back); driving only, not sweeps/holds
  return_turn_tol_deg: 20    # the turn-round first turns to within this of the new route heading;
                             #   from there the normal AVOID exit rules apply

link:                        # dashboard radio link (laptop at the entrance)
  link_range_m: 3.0          # link comes up within this distance of the entrance ...
  link_hyst_m: 0.3           # ... and drops this much further out (hysteresis)
  link_timeout_s: 0.5        # no heartbeat for this long = link down
  upload_retry_s: 2.0        # at HOME with the link down: try the upload again this often

battery:
  # Real rover: 3S2P Li-ion NMC, 4000 mAh (full 12.6 V, nominal 10.8-11.1 V). Voltage only, no
  # current sensor. Divider on Uno A1: 22k to +BATT, 10k to GND -> pack V = pin V x 3.2.
  # The Uno sends batt_x10 = averaged ADC count x 10:
  #   V = (batt_x10 / 10) / adc_max * adc_ref_v * divider_ratio * scale
  adc_ref_v: 5.0
  adc_max: 1023
  divider_ratio: 3.2
  scale: 1.0                 # calibration factor, 1.0 until measured against a multimeter
  avg_window_s: 5.0          # thresholds are judged on this moving average (motor load sag)
  # Starting values, to be tuned on the real pack. Must hold: return_v > warn_v > critical_v.
  # Each one latches: once the average has been below it, a recovering voltage changes nothing.
  return_v: 10.5             # -> RETURN
  warn_v: 10.2               # -> warning on the dashboard and in the run summary (no driving change)
  critical_v: 9.6            # -> rover stops: STUCK "battery critical", log flushed
  sim:                       # simulated pack only (placeholders until measured)
    cells: 3
    capacity_mah: 4000
    start_charge: 1.0        # 0..1; scenarios lower this to test the reserve
    drive_a: 2.0             # current at cruise command
    idle_a: 0.6              # current standing still
    internal_r_ohm: 0.15     # sag = current x this (about 0.3 V driving, 0.1 V idle)
    noise_v: 0.01
    ocv_cell_v:              # [charge, open-circuit volts per cell]
      - [0.00, 3.00]
      - [0.02, 3.30]
      - [0.05, 3.45]
      - [0.10, 3.60]
      - [0.20, 3.70]
      - [0.30, 3.76]
      - [0.40, 3.80]
      - [0.50, 3.85]
      - [0.60, 3.90]
      - [0.70, 3.96]
      - [0.80, 4.03]
      - [0.90, 4.11]
      - [1.00, 4.20]

sweep:
  angles_deg: [-90, -45, 0, 45, 90]
  settle_s: 0.35
  tolerance_deg: 2.0
  timeout_s: 25.0
  jpeg_quality: 85

log:
  csv_hz: 5
  status_period_s: 1.0
